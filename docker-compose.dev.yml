# Development overrides — use with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  backend:
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: 1
    volumes:
      - ./backend:/app
    command: ["python", "wsgi.py"]

  frontend:
    build:
      target: build
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "3000:3000"
