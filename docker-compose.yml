services:
  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: steam-optimizer-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-steam_optimizer}
      MYSQL_USER: ${MYSQL_USER:-steam_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_in_production}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - steam-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: steam-optimizer-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_DEBUG: ${FLASK_DEBUG:-0}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-change_me_to_random_secret_key}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:5000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-steam_optimizer}
      MYSQL_USER: ${MYSQL_USER:-steam_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_in_production}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      STEAMGRIDDB_API_KEY: ${STEAMGRIDDB_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    networks:
      - steam-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/api/health').raise_for_status()"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: steam-optimizer-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - steam-net
    depends_on:
      backend:
        condition: service_healthy

networks:
  steam-net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
