apiVersion: v1
kind: ConfigMap
metadata:
  name: steam-optimizer-config
  namespace: steam-optimizer
  labels:
    app.kubernetes.io/name: steam-optimizer
data:
  MYSQL_HOST: "mysql"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "steam_optimizer"
  FLASK_ENV: "production"
  FLASK_DEBUG: "0"
  GEMINI_MODEL: "gemini-2.5-flash"
  BACKEND_URL: "http://localhost:3000"
