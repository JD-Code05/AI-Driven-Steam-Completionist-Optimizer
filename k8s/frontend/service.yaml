apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: steam-optimizer
  labels:
    app.kubernetes.io/name: steam-optimizer
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
      protocol: TCP
      name: http
  selector:
    app: frontend
