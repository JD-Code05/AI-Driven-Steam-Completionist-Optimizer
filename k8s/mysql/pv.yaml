apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv
  labels:
    app.kubernetes.io/name: steam-optimizer
    app.kubernetes.io/component: database
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  # hostPath for Docker Desktop K8s — swap to cloud provisioner for production
  hostPath:
    path: /tmp/steam-optimizer/mysql-data
    type: DirectoryOrCreate
