apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: steam-optimizer
  labels:
    app.kubernetes.io/name: steam-optimizer
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
      name: mysql
  selector:
    app: mysql
